<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>킬리안 음바페</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --night: #070d24;
    --blue: #1b3fa0;
    --sky: #6f93ff;
    --red: #e63946;
    --gold: #f2c96b;
    --white: #f6f8ff;
    --panel-bg: rgba(8, 15, 40, 0.78);
    --panel-text: #ffd83a;
    --panel-muted: #ffe98a;
    --line: rgba(255, 216, 58, 0.3);
    --tile-bg: rgba(255, 255, 255, 0.07);
    --btn-bg: rgba(8, 15, 40, 0.55);
    --btn-text: #ffd83a;
    --page-bg: #070d24;
    --veil-top: rgba(7, 13, 36, 0.55);
    --veil-bottom: rgba(7, 13, 36, 0.92);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--white);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 48px;
    overflow: hidden;
    isolation: isolate;
  }

  .bg {
    position: absolute;
    inset: 0;
    z-index: -3;
    background-color: var(--night);
    background-image:
      radial-gradient(ellipse 60% 45% at 18% 8%, rgba(111,147,255,.55), transparent 70%),
      radial-gradient(ellipse 55% 40% at 84% 6%, rgba(230,57,70,.42), transparent 70%),
      radial-gradient(ellipse 90% 40% at 50% 108%, rgba(27,63,160,.9), transparent 75%),
      linear-gradient(180deg, #0a1440 0%, #070d24 100%);
    background-size: cover;
    background-position: center;
  }
  .veil {
    position: absolute;
    inset: 0;
    z-index: -2;
    background: linear-gradient(180deg, var(--veil-top), var(--veil-bottom));
  }
  .rays {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      repeating-linear-gradient(100deg, transparent 0 46px, rgba(255,255,255,.035) 46px 48px);
    pointer-events: none;
  }

  .hero {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .badge {
    width: clamp(150px, 34vw, 210px);
    aspect-ratio: 1;
    border-radius: 50%;
    padding: 5px;
    background: conic-gradient(from 210deg, var(--blue), var(--white), var(--red), var(--blue));
    box-shadow: 0 14px 50px rgba(0,0,0,.5);
    position: relative;
    border: 0;
    display: block;
  }
  .badge .inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #2b4fc0, #0b1a55 70%);
    display: block;
  }
  .badge .inner svg { width: 100%; height: 100%; display: block; }
  .stage.mode-country .badge .inner {
    background:
      linear-gradient(115deg, rgba(255,255,255,.28), rgba(255,255,255,0) 42%, rgba(0,0,0,.22)),
      linear-gradient(90deg, #1b3fa0 0 33.34%, #f6f8ff 33.34% 66.67%, #e63946 66.67% 100%);
  }
  .stage.mode-country .badge .inner svg { opacity: 0; }

  h1 {
    margin: 22px 0 4px;
    font-family: "Anton", "Noto Sans KR", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: 0.02em;
    color: #ffd83a;
    text-shadow: 0 4px 24px rgba(0,0,0,.55);
  }
  .sub {
    margin: 0 0 26px;
    color: #ffd83a;
    font-size: 1rem;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }
  .tab {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--btn-bg);
    color: var(--btn-text);
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 8px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background .18s, color .18s, transform .18s, border-color .18s;
  }
  .tab:hover { transform: translateY(-2px); border-color: var(--sky); }
  .tab:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .tab[aria-selected="true"] {
    background: #ffd83a;
    color: #0a1440;
    border-color: #ffd83a;
  }

  .panel {
    width: 100%;
    max-width: 640px;
    margin-top: 16px;
    padding: 24px 22px;
    text-align: left;
    background: var(--panel-bg);
    color: var(--panel-text);
    border: 1px solid var(--line);
    border-radius: 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .panel.swap { animation: swap .28s ease; }
  @keyframes swap { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .panel h2, .panel h3 { margin: 0 0 14px; color: #ffd83a; }
  .panel h3.sec { margin: 22px 0 10px; font-size: 1.02rem; font-weight: 700; }
  .big {
    font-family: "Anton", "Noto Sans KR", Impact, sans-serif;
    font-size: clamp(3.4rem, 14vw, 5.5rem);
    line-height: 1;
    margin: 0;
    color: #ffd83a;
  }
  .big small { font-family: "Noto Sans KR", sans-serif; font-size: 1.3rem; margin-left: 6px; color: var(--panel-muted); }
  dl.facts { margin: 16px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; }
  dl.facts dt { color: var(--panel-muted); }
  dl.facts dd { margin: 0; font-weight: 500; color: #ffd83a; }
  .note { color: var(--panel-muted); font-size: .92rem; margin: 14px 0 0; }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--tile-bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .tile b { display: block; font-family: "Anton", "Noto Sans KR", Impact, sans-serif; font-weight: 400; font-size: 2rem; line-height: 1.1; color: var(--gold); }
  .tile span { font-size: .92rem; color: var(--panel-muted); }

  ul.awards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.awards li { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding: 10px 12px;
    background: var(--tile-bg); border: 1px solid var(--line); border-radius: 12px; }
  ul.awards .yr { font-weight: 700; color: var(--gold); }
  ul.awards small { display: block; color: var(--panel-muted); }

  .trophies { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .trophy { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--tile-bg); border: 1px solid var(--line); border-radius: 12px; }
  .trophy span small { display: block; color: var(--panel-muted); }
  .trophy b { font-family: "Anton", "Noto Sans KR", Impact, sans-serif; font-weight: 400; font-size: 1.5rem; color: var(--gold); white-space: nowrap; }

  ol.career { list-style: none; margin: 0; padding: 0 0 0 20px; border-left: 2px solid var(--line); }
  ol.career li { position: relative; padding: 0 0 20px 18px; }
  ol.career li:last-child { padding-bottom: 0; }
  ol.career li::before {
    content: ""; position: absolute; left: -27px; top: 7px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--red); border: 2px solid var(--panel-bg);
  }
  ol.career .yr { color: var(--panel-muted); font-size: .9rem; }
  ol.career .club { font-weight: 700; font-size: 1.05rem; margin: 0; color: #ffd83a; }
  ol.career p { margin: 2px 0 0; color: var(--panel-muted); }

  @media (max-width: 520px) {
    .tabs { grid-template-columns: repeat(2, 1fr); }
    .tiles, .trophies { grid-template-columns: 1fr; }
    ul.awards li { grid-template-columns: 66px 1fr; }
    .panel { padding: 20px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel.swap { animation: none; }
    .tab { transition: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="rays"></div>

  <section class="hero">
    <div class="badge" id="badge" role="img" aria-label="선수 그림">
      <span class="inner">
        <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="팔짱 낀 세레모니 자세를 그린 일러스트">
          <defs>
            <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2f5be0"/>
              <stop offset="1" stop-color="#15318f"/>
            </linearGradient>
          </defs>
          <circle cx="120" cy="70" r="150" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
          <circle cx="120" cy="70" r="105" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
          <path d="M48 240 C48 178 74 140 120 140 C166 140 192 178 192 240 Z" fill="url(#jersey)"/>
          <path d="M100 141 L120 166 L140 141 Z" fill="#f6f8ff"/>
          <rect x="56" y="196" width="128" height="7" fill="#f6f8ff" opacity=".9"/>
          <rect x="56" y="206" width="128" height="7" fill="#e63946" opacity=".95"/>
          <rect x="107" y="118" width="26" height="28" rx="10" fill="#c9d6ff"/>
          <ellipse cx="120" cy="88" rx="29" ry="33" fill="#dbe4ff"/>
          <path d="M91 82 C92 56 148 56 149 82 C140 70 100 70 91 82 Z" fill="#0b1a55"/>
          <g>
            <rect x="52" y="164" width="120" height="26" rx="13" fill="#dbe4ff" transform="rotate(-14 112 177)"/>
            <rect x="68" y="164" width="120" height="26" rx="13" fill="#c9d6ff" transform="rotate(14 128 177)"/>
            <rect x="52" y="164" width="30" height="26" rx="13" fill="url(#jersey)" transform="rotate(-14 112 177)"/>
            <rect x="158" y="164" width="30" height="26" rx="13" fill="url(#jersey)" transform="rotate(14 128 177)"/>
          </g>
        </svg>
      </span>
    </div>

    <h1>KYLIAN MBAPPÉ</h1>
    <p class="sub">킬리안 음바페 · 프랑스 대표팀 주장 · 레알 마드리드 공격수</p>

    <div class="tabs" role="tablist" aria-label="선수 정보">
      <button class="tab" role="tab" id="tab-age" aria-controls="panel" aria-selected="true" data-key="age" type="button">나이</button>
      <button class="tab" role="tab" id="tab-country" aria-controls="panel" aria-selected="false" data-key="country" type="button">나라</button>
      <button class="tab" role="tab" id="tab-records" aria-controls="panel" aria-selected="false" data-key="records" type="button">기록</button>
      <button class="tab" role="tab" id="tab-career" aria-controls="panel" aria-selected="false" data-key="career" type="button">팀 경력</button>
    </div>

    <div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-age" aria-live="polite"></div>
  </section>
</main>

<script>
(function () {
  var BIRTH = new Date(1998, 11, 20);

  function calcAge() {
    var now = new Date();
    var age = now.getFullYear() - BIRTH.getFullYear();
    var m = now.getMonth() - BIRTH.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < BIRTH.getDate())) age--;
    return age;
  }

  var views = {
    age: function () {
      return '<h2>나이</h2>' +
        '<p class="big">' + calcAge() + '<small>세 (만)</small></p>' +
        '<dl class="facts">' +
        '<dt>생년월일</dt><dd>1998년 12월 20일</dd>' +
        '<dt>키</dt><dd>178cm</dd>' +
        '<dt>포지션</dt><dd>공격수 (스트라이커 · 윙)</dd>' +
        '<dt>주발</dt><dd>오른발</dd>' +
        '</dl>' +
        '<h3 class="sec">등번호</h3>' +
        '<div class="tiles">' +
        '<div class="tile"><b>10번</b><span>레알 마드리드 (2025–26시즌부터)</span></div>' +
        '<div class="tile"><b>10번</b><span>프랑스 대표팀</span></div>' +
        '</div>' +
        '<p class="note">이전 번호: 레알 마드리드 9번(2024–25시즌), 파리 생제르맹 7번. 나이는 오늘 날짜 기준으로 자동 계산돼요.</p>';
    },
    country: function () {
      return '<h2>나라</h2>' +
        '<p class="big" style="font-size:clamp(2.6rem,10vw,3.8rem)">프랑스 🇫🇷</p>' +
        '<dl class="facts">' +
        '<dt>성장지</dt><dd>파리 근교 봉디</dd>' +
        '<dt>대표팀</dt><dd>프랑스 A대표팀 주장, 2017년 데뷔</dd>' +
        '<dt>월드컵</dt><dd>2018 우승 · 2022 준우승 · 2026 4위</dd>' +
        '<dt>그 외</dt><dd>UEFA 네이션스리그 2020–21 우승, U19 유럽선수권 2016 우승</dd>' +
        '</dl>';
    },
    records: function () {
      return '<h2>기록</h2>' +
        '<p class="big">430<small>골 이상 · 클럽 + 프랑스 대표팀 통산</small></p>' +
        '<div class="tiles" style="margin-top:14px">' +
        '<div class="tile"><b>66골</b><span>프랑스 대표팀 (역대 최다 득점자)</span></div>' +
        '<div class="tile"><b>22골</b><span>월드컵 통산 (역대 1위)</span></div>' +
        '<div class="tile"><b>297골</b><span>리그·국내대회 (2025–26 시즌 종료 기준)</span></div>' +
        '<div class="tile"><b>70골</b><span>UEFA 클럽대항전 (챔피언스리그 등)</span></div>' +
        '</div>' +
        '<p class="note">골 수는 집계 기준과 시점에 따라 조금씩 달라요. 2026–27시즌 골은 아직 반영하지 않았어요.</p>' +
        '<h3 class="sec">수상경력</h3>' +
        '<ul class="awards">' +
        '<li><span class="yr">2026</span><span>월드컵 골든부트 (10골) · 브론즈볼<small>월드컵 득점왕을 두 번 차지한 최초의 선수</small></span></li>' +
        '<li><span class="yr">2025–26</span><span>챔피언스리그 득점왕 (15골) · 라리가 득점왕 (25골)</span></li>' +
        '<li><span class="yr">2024–25</span><span>유러피언 골든슈 (라리가 31골)</span></li>' +
        '<li><span class="yr">2022</span><span>월드컵 골든부트 (8골)<small>결승전 해트트릭</small></span></li>' +
        '<li><span class="yr">2018</span><span>월드컵 영플레이어상</span></li>' +
        '<li><span class="yr">2017</span><span>골든보이</span></li>' +
        '<li><span class="yr">리그1</span><span>올해의 선수 여러 차례 수상</span></li>' +
        '</ul>' +
        '<h3 class="sec">트로피 (통산 23회 우승)</h3>' +
        '<div class="trophies">' +
        '<div class="trophy"><span>FIFA 월드컵<small>2018 · 프랑스</small></span><b>×1</b></div>' +
        '<div class="trophy"><span>UEFA 네이션스리그<small>2020–21 · 프랑스</small></span><b>×1</b></div>' +
        '<div class="trophy"><span>U19 유럽선수권<small>2016 · 프랑스 U19</small></span><b>×1</b></div>' +
        '<div class="trophy"><span>리그1<small>모나코 1 · 파리 생제르맹 6</small></span><b>×7</b></div>' +
        '<div class="trophy"><span>쿠프 드 프랑스<small>파리 생제르맹</small></span><b>×4</b></div>' +
        '<div class="trophy"><span>쿠프 드 라 리그<small>파리 생제르맹</small></span><b>×2</b></div>' +
        '<div class="trophy"><span>트로페 데 샹피옹<small>파리 생제르맹</small></span><b>×5</b></div>' +
        '<div class="trophy"><span>UEFA 슈퍼컵<small>2024 · 레알 마드리드</small></span><b>×1</b></div>' +
        '<div class="trophy"><span>FIFA 인터콘티넨털컵<small>2024 · 레알 마드리드</small></span><b>×1</b></div>' +
        '</div>' +
        '<p class="note">기록 기준: 2026년 9월. 시즌 중에는 계속 바뀔 수 있어요.</p>';
    },
    career: function () {
      return '<h2>팀 경력</h2>' +
        '<ol class="career">' +
        '<li><span class="yr">유소년</span><p class="club">AS 봉디 → 클레르퐁텐</p><p>프랑스 축구협회 산하 엘리트 유소년 아카데미 출신.</p></li>' +
        '<li><span class="yr">2015–2017</span><p class="club">AS 모나코</p><p>2016–17시즌 리그1 우승, 챔피언스리그 4강 진출.</p></li>' +
        '<li><span class="yr">2017–2024</span><p class="club">파리 생제르맹</p><p>리그1 6회, 쿠프 드 프랑스 4회, 쿠프 드 라 리그 2회 우승. 통산 256골로 구단 최다 득점자.</p></li>' +
        '<li><span class="yr">2024–현재</span><p class="club">레알 마드리드</p><p>2024년 7월 자유계약으로 이적. UEFA 슈퍼컵 우승, 2024–25 라리가 31골.</p></li>' +
        '<li><span class="yr">2017–현재</span><p class="club">프랑스 국가대표팀</p><p>월드컵 3회 출전, 통산 22골로 월드컵 역대 최다 득점자.</p></li>' +
        '</ol>';
    }
  };

  var panel = document.getElementById('panel');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var stage = document.getElementById('stage');

  function show(key, animate) {
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-key') === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if (on) panel.setAttribute('aria-labelledby', t.id);
    });
    stage.classList.toggle('mode-country', key === 'country');
    panel.innerHTML = views[key]();
    if (animate) {
      panel.classList.remove('swap');
      void panel.offsetWidth;
      panel.classList.add('swap');
    }
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t.getAttribute('data-key'), true); });
    t.addEventListener('keydown', function (e) {
      var n = null;
      if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
      if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
      if (n !== null) { e.preventDefault(); tabs[n].focus(); show(tabs[n].getAttribute('data-key'), true); }
    });
  });
  show('age', false);
})();
</script>
</body>
</html>
